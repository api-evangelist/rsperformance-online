    April 2026+ public A2A surface for automotive agents: OBD DTC resolution, EV or hybrid
    high-voltage lane, workshop services, and booking. Dual transport: HTTP+JSON message endpoints
    and full JSON-RPC 2.0 on POST / for tasks, streaming, history and list operations.
  version: 2.5.0
  protocol_version: 0.3.0
  documentation_url: https://rsperformance.online/llms-full.txt
  icon_url: https://rsperformance.online/images/rs_logo_new.webp
  provider:
    organization: RS Performance
    url: https://rsperformance.online
    founding_date: '2021-09-14'
    predecessor: Premio Ring (same address, dissolved 2021-09-14 — the card carries a rebranding-continuity block)
  supported_interfaces:
  - url: https://rsperformance.online/message:send
