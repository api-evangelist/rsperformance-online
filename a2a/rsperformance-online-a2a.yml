conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: 0.3.0
  preferred_transport: null
  transport: JSONRPC and HTTP+JSON (via supportedInterfaces[].protocolBinding)
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (streaming,
    pushNotifications, extendedAgentCard, extensions[] as fields). protocolVersion is present at the
    top level ("0.3.0"). skills is an ARRAY of nine skills, each with id, name, description, tags and
    examples; three also declare inputModes/outputModes. Both optional discriminators are present
    (defaultInputModes, defaultOutputModes). preferredTransport is absent, which is spec-current for
    the 1.0-shaped supportedInterfaces[] block the card uses to declare its bindings.
  deviations:
  - field: url / protocolVersion / supportedInterfaces
    observed: top-level url is null; top-level protocolVersion is "0.3.0" while each supportedInterfaces[] entry declares protocolVersion "1.0"
    note: >-
      The card mixes two shapes. A2A 0.3.0 requires a top-level url (and used preferredTransport +
      additionalInterfaces); A2A 1.0 replaced that triple with supportedInterfaces[]. This card declares
      0.3.0 at the top but is 1.0-shaped in its interfaces, so a strict 0.3.0 reader finds no url and
      a strict 1.0 reader finds a stale protocolVersion. Every interface URL is real and answers.
  - field: securitySchemes / securityRequirements
    observed: empty object and empty array
    note: >-
      The surface is deliberately anonymous — the legacy agent.json states authentication.schemes
      ["none"] and the provider's agents.json states authentication.type "none". Valid per spec, but a
      reader cannot distinguish "public by design" from "not yet declared" from the canonical card alone.
  - field: tasks/list (operational)
    observed: anonymous JSON-RPC tasks/list returned 34 tasks created by other callers, with their artifacts
    note: >-
      Consistent with the card's "task list is operational cache" note, but it means any client can
      read every other client's task history on the shared public agent. Recorded as an observation
      about the deployment, not a card-shape defect.
  - field: extension keys
    observed: five non-standard top-level keys (x_rs_rebranding_2026, x_rs_ai_friendly_2026_04, x_rs_a2a_skill_matrix_2026_05, rs_discovery_wow_2026_04, x_rs_a2a_operator_2026_04) and x_rs_transport_note inside supportedInterfaces[]
    note: >-
      Underscore-prefixed vendor keys rather than the extensions[] mechanism the card also uses. A
      schema-strict validator will flag rs_discovery_wow_2026_04, which carries no x prefix at all.
  - field: legacy /.well-known/agent.json
    observed: a second, older card (version 2.2.0, 4 skills, url set, streaming true, stateTransitionHistory true, pushNotifications false)
    note: >-
      Two divergent cards are live at the two well-known paths. A client that reads the legacy path
      sees four skills and no gateway-routing skill; one that reads the canonical path sees nine.
  - field: capabilities.extendedAgentCard
    observed: 'true'
    note: The card advertises an authenticated extended card but declares no security scheme under which to request one.
surface_relationship:
  note: >-
    RS Performance publishes three agent surfaces that are NOT projections of one another. A2A: nine
    skills on the apex host with JSON-RPC 2.0 on POST / and HTTP+JSON message endpoints (this card).
    MCP: a remote FastMCP server "Diagnosta RS" at https://mcp.rs3d.pl/ with 14 tools reachable
    anonymously (mcp/rsperformance-online-mcp.yml). REST: a 3-operation "RS Performance AI Gateway"
    OpenAPI 3.1.0 on https://ai.rsperformance.online (openapi/). The A2A card's
    gateway-semantic-routing skill points at the REST semanticSearch operation as its support plane.
