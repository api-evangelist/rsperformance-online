domain_standards:
  - id: sae-j2012-obd-ii-dtc
    conforms: true
    evidence: >-
      The contract uses the OBD-II diagnostic trouble code identifier scheme (SAE J2012 / ISO 15031-6,
      five-character P/B/C/U codes) as a first-class field: the OpenAPI response schema for
      semanticSearch declares matched_dtc_codes[] and hits[].dtc_codes[]
      (openapi/rsperformance-online-ai-gateway-openapi.yml), the A2A skill dtc-lookup is tagged
      OBD-II, P-codes, C-codes, B-codes, U-codes, the MCP tool search_repair_reports takes a
      fault_code parameter, and the live gateway returned matched code P0299 for that query.
      The provider also publishes the codes as a 5.6 MB JSON feed at /feeds/dtc.json.
    scope: identifier scheme carried in contract fields, not a claim of certification
compliance_program:
  published: false
  note: >-
    No SOC 2 / ISO 27001 / trust-center style compliance program is published for the API surface.
    The workshop's JSON-LD lists DEKRA, Bosch Car Service and Premio (Continental) credentials —
    automotive-trade certifications for the physical workshop, not information-security attestations,
    so no Compliance pointer is emitted.
