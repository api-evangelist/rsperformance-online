  - {tool: repair_reports_overview, reason: 'proxies a "secured Laravel API" the OpenAPI does not describe; the public equivalent is the static feed https://rsperformance.online/feeds/repair-reports.json'}
  - {tool: search_repair_reports, reason: same secured Laravel API; no public REST contract}
  - {tool: get_repair_report, reason: same secured Laravel API; no public REST contract}
