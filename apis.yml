aid: rsperformance-online
name: RS Performance
description: >-
  RS Performance Sp. z o.o. is a single-location automotive diagnostics and repair workshop at
  Al. Grunwaldzka 303B in Gdańsk, Poland (the Premio Ring site, rebranded 2021-09-14), serving
  Gdańsk, Sopot, Gdynia and the Tricity with 19 workshop services from computer diagnostics, DPF/AdBlue,
  turbo and gearbox work to tyre storage and B2B fleet service. What makes it an API provider is the
  machine-readable layer it has built over its knowledge base: an anonymous A2A agent (nine skills,
  JSON-RPC 2.0 and HTTP+JSON on rsperformance.online, agent card at the canonical well-known path),
  a remote FastMCP server "Diagnosta RS" with 14 tools over a Qdrant vector store of services, FAQ,
  repair reports and 12,000+ OBD-II fault codes, and a three-operation OpenAPI 3.1 "AI Gateway" on
  ai.rsperformance.online for answer-first semantic search, freshness and answer routing — plus
  llms.txt, security.txt, an ai-plugin manifest, JSON/Atom change feeds and a DTC JSON feed. Every
  surface is free and unauthenticated under a fair-use, attribution-required policy.
