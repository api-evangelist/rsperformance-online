- name: Diagnosta RS MCP Server
  description: >-
    Remote Model Context Protocol server (FastMCP, protocol 2025-06-18, Streamable HTTP with a session
    header, legacy SSE at /mcp) at https://mcp.rs3d.pl/ — a host the provider's own /.well-known/mcp.json,
    ai-plugin.json and CSP name and that shares the gateway's IP. Fourteen tools answered an anonymous
    tools/list: semantic_search, diagnostic_search, search_notes, read_note, repair_reports_overview,
    search_repair_reports, get_repair_report, health, list_sources and five web-research/ingest tools,
    two of which write to the provider's store. A second advertised server at /laravel/mcp/rs-knowledge
    returned HTTP 500 (MCP_SERVER_TOKEN missing) at probe time.
  humanURL: https://rsperformance.online/wiedza-ai
  baseURL: https://mcp.rs3d.pl
