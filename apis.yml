apis:
- name: RS Performance A2A Agent
  description: >-
    Public A2A agent for automotive intents — OBD DTC lookup, vehicle diagnostics, repair services, EV/hybrid
    and climate/HVAC knowledge, a 19-service catalog, ten Gdańsk district routes, booking and gateway
    semantic routing (nine skills). JSON-RPC 2.0 on POST https://rsperformance.online/ (message/send,
    message/stream, tasks/get, tasks/list, tasks/cancel, tasks/subscribe) plus HTTP+JSON interfaces at
    /message:send, /message:stream and /tasks. Agent card version 2.5.0, protocolVersion 0.3.0, graded
    conformant; anonymous; 60 requests/minute fair-use limit signalled with X-RateLimit-*.
  humanURL: https://rsperformance.online/centrum-wiedzy
  tags:
